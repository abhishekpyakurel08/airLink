version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: airlink-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: airlink
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: airlink-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
